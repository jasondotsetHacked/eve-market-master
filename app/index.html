<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EVE Market Master</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>EVE Market Master</h1>
        <p id="session-status">Local market watchlist and weighted average price analysis.</p>
      </div>
      <nav class="top-actions">
        <a id="login-link" class="button" href="/auth/login">Log In</a>
        <a id="logout-link" class="button subtle hidden" href="/auth/logout">Log Out</a>
        <a class="button subtle" href="/development/sso/">Dev SSO</a>
      </nav>
    </header>

    <main class="workspace">
      <section class="panel watchlist">
        <div class="panel-header">
          <div>
            <h2>Watchlist</h2>
            <span id="watchlist-meta">Loading character market activity</span>
          </div>
          <button id="refresh-watchlist" type="button">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Buy Avg</th>
                <th>Sell Avg</th>
                <th>Qty In</th>
                <th>Qty Out</th>
                <th>Position</th>
                <th>Jita Sell</th>
                <th>Jita Buy</th>
              </tr>
            </thead>
            <tbody id="watchlist-body"></tbody>
          </table>
        </div>
      </section>

      <section class="panel chart-panel">
        <div class="panel-header">
          <div>
            <h2 id="chart-title">Market Price</h2>
            <span id="chart-subtitle">Weighted average buy and sell prices vs Jita</span>
          </div>
        </div>
        <div id="market-chart" class="chart"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
